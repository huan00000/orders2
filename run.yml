services:
  orders2:
    image: "${GHCR_IMAGE:?请在 .env 中设置 GHCR_IMAGE}:latest"
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      API_KEY: "${API_KEY:?请在 .env 中设置 API_KEY}"
      API_SECRET: "${API_SECRET:?请在 .env 中设置 API_SECRET}"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
